<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidan hittades inte | Brams Burger</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/img/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        html, body { margin: 0; min-height: 100%; background: #0c0c0c; color: #fff; font-family: 'Inter', sans-serif; }
        main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; box-sizing: border-box; }
        .label { font-size: 12px; font-weight: 900; letter-spacing: .4em; text-transform: uppercase; color: #c68c17; margin-bottom: 24px; }
        h1 { font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: clamp(56px, 14vw, 160px); line-height: 1; margin: 0 0 24px; letter-spacing: .02em; }
        p { font-size: 18px; font-weight: 500; color: rgba(255,255,255,.7); max-width: 520px; line-height: 1.6; margin: 0 0 40px; }
        nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        nav a { min-height: 44px; display: inline-flex; align-items: center; padding: 12px 28px; border-radius: 9999px; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #fff; background: #c68c17; text-decoration: none; transition: background .2s; }
        nav a:hover { background: #2d4a3e; }
        nav a.secondary { background: rgba(255,255,255,.1); }
    </style>
</head>
<body>
    <main>
        <div class="label">Brams Burger</div>
        <h1>404</h1>
        <p>Sidan du letar efter finns inte längre, eller så blev adressen fel. Menyn och restaurangerna finns kvar.</p>
        <nav>
            <a href="/">Hem</a>
            <a href="/menu" class="secondary">Meny</a>
            <a href="/locations" class="secondary">Restauranger</a>
            <a href="/contact" class="secondary">Kontakt</a>
        </nav>
    </main>
</body>
</html>
